# Smoke test config — minimal for fast startup
_base_: qwen_v1_scenes.yaml

data:
  preload: false
  num_samples: 1
  batch_size: 1
  image_size: 64
  max_frames: 4
  temporal_window_augmentation: false

experiment:
  name: aef_qwen_v1_smoke
  output_dir: /workspace/outputs/aef_qwen_v1_smoke

model:
  gradient_checkpointing: false
  num_blocks: 2

training:
  epochs: 1
  save_every: 1
  gradient_accumulation_steps: 1
  recon_warmup_epochs: 0
  warmup_epochs: 0
