experiment:
  name: aef_qwen_v2_hr_from_scratch
  seed: 42
  output_dir: /workspace/outputs/aef_qwen_v2_hr_from_scratch

data:
  dataset_type: harbin_patches
  manifest_path: /workspace/raw/phase1_harbin/harbin_scenes_cloud_filtered
  stats_dir: /workspace/statistics/harbin_scenes
  batch_size: 2
  num_workers: 4
  image_size: 128
  max_frames: 32
  num_samples: 424
  num_classes: 11
  input_dim: 6
  metadata_dim: 4
  num_input_sources: 5          # S2, S1, Landsat, S2_HR, S1_HR
  num_target_sources: 7         # 输入3类 + 静态4类
  random_target_frame: true
  spatial_augmentation: true
  temporal_window_augmentation: true
  temporal_window_prob: 0.5
  temporal_window_min_frames: 4
  temporal_window_max_frames: 24
  cloud_filter_threshold: 0.0
  variance_weighted: false
  filter_2025_monthly: false
  source_channels:
    s2: 6
    s1: 2
    landsat: 6
    s2_hr: 6
    s1_hr: 1
  merge_hr_into_lr: false

model:
  input_dim: 6
  stem_dim: 128
  precision_dim: 256
  time_dim: 256
  space_dim: 256
  embedding_dim: 128
  time_code_dim: 64
  window_code_dim: 64
  relative_time_code_dim: 16
  num_blocks: 8
  num_heads: 8
  vmf_kappa: 2000.0
  bottleneck_noise_scale: 0.02
  reconstruction_channels: 6
  metadata_dim: 4
  num_sensor_types: 16
  gradient_checkpointing: true
  per_source_decoders: false
  decoder_hidden_mult: 1
  skip_l2_norm_training: true
  spatial_dropout_rate: 0.0
  stem_channels: 6
  source_channels:
    s2: 6
    s1: 2
    landsat: 6
    s2_hr: 6
    s1_hr: 1

training:
  epochs: 400
  gradient_accumulation_steps: 4
  lr: 0.00005
  weight_decay: 0.01
  grad_clip_norm: 1.0
  teacher_dropout_rate: 0.1
  student_frame_drop_rate: 0.2
  student_source_drop_rate: 0.2
  lr_schedule: cosine_no_restart
  warmup_epochs: 10
  recon_warmup_epochs: 10
  save_every: 50
  checkpoint_interval: 20
  early_stop_patience: 150
  # 损失权重 (对齐 v2_temporal 成功经验)
  reconstruction_weight: 0.5
  uniformity_weight: 0.15
  pre_norm_uniform_weight: 1.5
  encoder_uniform_weight: 1.0
  decorrelation_weight: 0.005
  variance_weight: 0.5
  orthogonality_weight: 0.5
  consistency_weight: 0.0
  classification_weight: 0.0
  aux_classification_weight: 0.0
  bottleneck_cls_weight: 0.0
  # ★ 时序对比损失 (关键修复: margin 0.0→0.5, weight 0.3→2.0)
  temporal_contrastive_weight: 2.0
  temporal_contrastive_temperature: 0.2
  # best 保存阈值
  save_best_balanced: true
  best_balanced_uniform_min: -5.0
  best_balanced_uniform_max: -1.0
