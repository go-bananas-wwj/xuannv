# ============================================================
# AEF_qwen V3 — 改进双窗口采样 + 更大时序对比权重
# ============================================================
# 核心改进:
#   1. 训练时随机抽取两个不重叠的时间段窗口
#   2. temporal_contrastive_weight: 0.5 → 2.0
#   3. temporal_contrastive_temperature: 0.1 → 0.05
#
# 基于: V2 epoch_499.pt checkpoint
# 启动:
#   CUDA_VISIBLE_DEVICES=5,6,7 torchrun --nproc_per_node=3 \
#     scripts/train_ddp.py --config configs/qwen_v3_temporal.yaml \
#     --resume /workspace/outputs/aef_qwen_v2/epoch_499.pt \
#     --save-every 50 --warmup-epochs 5
# ============================================================

_base_: qwen_v1_scenes.yaml

experiment:
  name: aef_qwen_v3_temporal
  output_dir: /workspace/outputs/aef_qwen_v3

data:
  # 新增: 双窗口不重叠采样
  non_overlapping_windows: true
  min_window_frames: 4
  max_window_frames: 12

training:
  # 从 V2 接续训练
  lr: 0.000005
  warmup_epochs: 5
  epochs: 800
  early_stop_patience: 80

  # 原有损失权重
  reconstruction_weight: 0.8
  uniformity_weight: 0.25
  pre_norm_uniform_weight: 2.0
  encoder_uniform_weight: 1.5
  decorrelation_weight: 0.008
  variance_weight: 0.8
  orthogonality_weight: 0.8
  consistency_weight: 0.0

  # ★ 增强时序对比损失
  temporal_contrastive_weight: 2.0
  temporal_contrastive_temperature: 0.05

  best_balanced_uniform_min: -5.0
  best_balanced_uniform_max: -1.0
