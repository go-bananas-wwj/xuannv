# 玄女V2 Experiment A — Skip L2 Norm 训练
# 核心假设: 训练时跳过 L2 Norm，在欧氏空间计算 uniformity，避免 Jacobian 梯度屏障
_base_: xuannv_v2.yaml

experiment:
  name: exp_v2_A_skipL2_50ep_0520
  output_dir: /workspace/outputs/exp_v2_A_skipL2_50ep_0520
  seed: 42

model:
  skip_l2_norm_training: true  # ★ 训练时跳过 L2 Norm

training:
  epochs: 50
  lr: 0.0001
  lr_min: 0.000001
  warmup_epochs: 10
  recon_warmup_epochs: 0

  # 核心损失权重 (从保守基线调高)
  reconstruction_weight: 1.0
  consistency_weight: 0.15
  batch_uniformity_weight: 0.1

  # VICReg 辅助反坍缩
  variance_weight: 0.3
  covariance_weight: 0.1
  vicreg_min_std: 1.0

  # Spatial Uniformity
  use_spatial_uniformity: true
  spatial_uniformity_samples: 4096

  # 保存
  save_every: 5
  max_steps_per_epoch: 100
  save_best_balanced: true
