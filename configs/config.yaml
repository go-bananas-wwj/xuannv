# ============================================================
# xuannv Round 9 — 修复版训练配置
# 核心改进:
#   1. 恢复 7 个重建目标（+WorldCover/DynamicWorld/JRC Water）
#   2. 增加训练量: 100 epochs × 200 steps
#   3. 降低 VICReg Cov 权重 (0.04 -> 0.001)
#   4. 空间感知 Temporal Loss
#   5. Batch Size=4
# ============================================================

experiment:
  name: round9_baseline
  seed: 42
  output_dir: /workspace/outputs/round9_baseline

data:
  dataset_type: harbin_patches
  manifest_path: /workspace/raw/phase1_harbin/harbin_scenes_cloud_filtered
  stats_dir: /workspace/statistics/harbin_scenes
  batch_size: 4
  num_workers: 0
  image_size: 128
  max_frames: 32
  num_samples: 424
  num_classes: 11
  input_dim: 6
  metadata_dim: 4
  num_input_sources: 3
  num_target_sources: 7
  random_target_frame: true
  spatial_augmentation: true
  temporal_window_augmentation: true
  temporal_window_prob: 0.5
  temporal_window_min_frames: 4
  temporal_window_max_frames: 24
  preload: true

  # 每个源的实际通道数（输入编码用）
  source_channels:
    s2: 6
    s1: 2
    landsat: 6

  # ★ 目标源配置：S2+S1+Landsat+DEM+WorldCover+DynamicWorld+JRC_Water
  target_sources:
    - name: s2
      loss_type: 0        # 0=continuous (L1)
      sensor_src: s2
      out_channels: 6
    - name: s1
      loss_type: 0
      sensor_src: s1
      out_channels: 2
    - name: landsat
      loss_type: 0
      sensor_src: landsat
      out_channels: 6
    - name: dem
      loss_type: 0
      sensor_src: null
      out_channels: 1
    - name: worldcover
      loss_type: 1        # 1=classification (CE)
      sensor_src: null
      out_channels: 11
    - name: dynamic_world
      loss_type: 1
      sensor_src: null
      out_channels: 9
    - name: jrc_water
      loss_type: 0        # 连续值回归（数据范围 0-98）
      sensor_src: null
      out_channels: 1

model:
  input_dim: 6
  stem_dim: 128
  precision_dim: 128
  time_dim: 256
  space_dim: 256
  embedding_dim: 128
  time_code_dim: 64
  window_code_dim: 64
  relative_time_code_dim: 16
  num_blocks: 8
  num_heads: 8
  vmf_kappa: 50.0
  bottleneck_noise_scale: 0.02
  metadata_dim: 4
  num_sensor_types: 16
  gradient_checkpointing: true
  per_source_decoders: true
  decoder_hidden_mult: 1
  skip_l2_norm_training: true

training:
  epochs: 100
  gradient_accumulation_steps: 1
  lr: 0.0001
  lr_min: 0.000001
  weight_decay: 0.01
  grad_clip_norm: 1.0

  # ★ 损失权重
  reconstruction_weight: 0.1
  consistency_weight: 0.05
  classification_weight: 0.03
  decorrelation_weight: 0.0
  orthogonality_weight: 0.01
  pre_norm_uniform_weight: 0.5
  variance_weight: 0.25
  covariance_weight: 0.001    # ★ Round 9: 从 0.04 大幅降低
  vicreg_min_std: 1.0

  # ★ 空间感知 Temporal Loss
  temporal_cosine_pixel_weight: 0.5
  temporal_magnitude_temperature: 0.1
  temporal_use_spatial_weight: true  # ★ Round 9 新参数

  # ★ 源特定重建权重
  source_recon_weights: [1.0, 1.0, 1.0, 0.05, 0.5, 0.5, 0.3]  # S2, S1, Landsat, DEM, WC, DW, JRC

  # 禁用其他复杂损失
  temporal_gap_aware_weight: 0.0
  pixel_change_supervision_weight: 0.0
  change_consistency_weight: 0.0
  text_contrastive_weight: 0.0
  vicreg_weight: 0.0
  dino_weight: 0.0
  koleo_weight: 0.0
  temporal_magnitude_weight: 0.0
  pixel_temporal_info_nce_weight: 0.0
  l2_temporal_weight: 0.0
  ct_reconstruction_weight: 0.0
  aux_classification_weight: 0.0
  bottleneck_cls_weight: 0.0
  encoder_uniform_weight: 0.0

  # Teacher-Student
  teacher_momentum: 0.996
  teacher_dropout_rate: 0.1
  student_frame_drop_rate: 0.5
  student_source_drop_rate: 0.3
  student_front_drop_prob: 0.15
  student_back_drop_prob: 0.15

  # Kappa
  kappa_start: 50.0
  kappa_end: 50.0
  kappa_warmup_epochs: 0

  # 学习率调度
  lr_schedule: cosine_no_restart
  warmup_epochs: 10
  recon_warmup_epochs: 0

  # 每 epoch 最大步数
  max_steps_per_epoch: 200

  # 保存
  save_every: 20
  save_best_balanced: true
  best_balanced_uniform_min: 0.0
  best_balanced_uniform_max: 0.3
  early_stop_patience: 100

evaluation:
  knn_k: 5
  bootstrap_samples: 100
