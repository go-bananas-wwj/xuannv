experiment_name: aef_haidian
output_dir: /workspace/xuannv/outputs/aef_haidian
seed: 42

data:
  data_root: data_raw/haidian/scenes
  planet_root: data_raw/beijing/planetscene
  stats_dir: statistics/haidian
  image_size: 128
  batch_size: 4
  num_workers: 0
  max_frames: 16
  source_names:
    - tianyi_sar
    - s2
    - landsat
    - planet

model:
  model_size: small
  per_source_latent: 32
  enable_text_align: false

training:
  max_steps: 100000
  lr: 0.0001
  weight_decay: 0.05
  warmup_steps: 2000
  log_every: 50
  save_every: 5000
  eval_every: 5000
  recon_weight: 1.0
  uniformity_weight: 0.05
  consistency_weight: 0.02
