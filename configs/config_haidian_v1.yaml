# ============================================================
# xuannv 海淀嵌入底座 v1 — 改进版训练配置
# 创建时间: 2026-05-29
#
# 核心改进（相比哈尔滨 Round 9 基线）:
#   1. 集成天仪 SAR 作为第 4 路输入（X 波段，1 通道 VV）
#   2. 启用 Barlow Twins 去相关（decorrelation_weight: 0.01）
#   3. 启用 gap-aware 时序损失（temporal_gap_aware_weight: 0.1）
#   4. 增强 VICReg 协方差正则（covariance_weight: 0.001 → 0.01）
#   5. 新增 LMIM 潜在空间预测损失（lmim_weight: 0.3）
#   6. 5 个目标源（无 dynamic_world / jrc_water，海淀数据不含）
# ============================================================

experiment:
  name: haidian_v1_improved
  seed: 42
  output_dir: /workspace/outputs/exp_v1_haidian_stats_fix_0530_v21

data:
  dataset_type: harbin_patches
  # ★ 指向 haidian_train 根目录（不是 /haidian 子目录），
  #   这样 dataset.py 能在直接子目录找到 tianyi_sar/，
  #   同时通过一层嵌套搜索找到 haidian/s2/, haidian/s1/ 等
  manifest_path: /workspace/raw/haidian_train
  stats_dir: /workspace/statistics/haidian_train
  batch_size: 2
  num_workers: 0
  image_size: 128
  max_frames: 24
  num_samples: 320
  num_classes: 11
  input_dim: 6
  metadata_dim: 4

  # ★ 4 路输入（含天仪 SAR）
  num_input_sources: 4
  input_sources:
    - s2
    - s1
    - landsat
    - tianyi_sar

  # ★ 每个源的实际通道数
  source_channels:
    s2: 6
    s1: 2
    landsat: 6
    tianyi_sar: 1

  # ★ 5 个目标源（海淀无 dynamic_world / jrc_water）
  num_target_sources: 5
  target_sources:
    - name: s2
      loss_type: 0        # continuous (L1)
      sensor_src: s2
      out_channels: 6
    - name: s1
      loss_type: 0
      sensor_src: s1
      out_channels: 2
    - name: landsat
      loss_type: 0
      sensor_src: landsat
      out_channels: 6
    - name: dem
      loss_type: 0
      sensor_src: null
      out_channels: 1
    - name: worldcover
      loss_type: 1        # classification (CE)
      sensor_src: null
      out_channels: 11

  random_target_frame: true
  spatial_augmentation: true
  temporal_window_augmentation: true
  temporal_window_prob: 0.5
  temporal_window_min_frames: 4
  temporal_window_max_frames: 24
  preload: true

  # ★ MAE-style block 掩码（50% 掩码，保留足够重建压力防止坍缩）
  recon_mask_ratio: 0.5        # 降回50%：75%时recon太容易→decoder用均值即可→embedding无压力
  recon_mask_patch_size: 16    # 每个 block 16×16 像素（128/16=8×8=64 个 block）

  # ★ 必须保持 false——海淀数据含 2026 年帧，设 true 会全部丢失
  filter_2025_monthly: false

model:
  input_dim: 6
  stem_dim: 128
  precision_dim: 128
  time_dim: 256
  space_dim: 256
  embedding_dim: 64
  time_code_dim: 64
  window_code_dim: 64
  relative_time_code_dim: 16
  num_blocks: 8
  num_heads: 8
  vmf_kappa: 8000.0
  bottleneck_noise_scale: 0.02
  metadata_dim: 4
  num_sensor_types: 16   # 已预留足够类型 ID（tianyi_sar=7）
  gradient_checkpointing: true
  per_source_decoders: true
  decoder_hidden_mult: 1
  skip_l2_norm_training: true

training:
  epochs: 80
  gradient_accumulation_steps: 2
  lr: 0.0001
  lr_min: 0.000001
  weight_decay: 0.01
  grad_clip_norm: 1.0

  # ★★★ v12 根因修复：完全复制哈尔滨成功损失组合
  #
  # 根因分析（v1-v11 共同失败）：
  #   所有已尝试的损失（PID/VICReg/uniformity）在完全坍缩态(所有z=z*)都有零梯度
  #   无法从坍缩态逃出 → v1-v11全部失败
  #
  # 哈尔滨成功的真正原因：
  #   多重损失协同【预防】坍缩（而非逃出坍缩）：
  #   1. reconstruction(0.1): 重建目标各patch不同 → 梯度非零（但trivial solution存在）
  #   2. consistency(0.05): teacher(full)≠student(50%frame_drop) → 无法坍缩到同一点
  #   3. temporal_cosine_pixel(0.5): 多时序窗口对比 → temporal sensitivity
  #   4. pre_norm_uniform(0.5): 欧氏空间uniformity → 维持分散
  #   5. variance(0.25): VICReg variance → 维持维度活跃
  #
  # v12 = 哈尔滨配置（去掉PID、去掉spatial VICReg）

  # ★ 核心四件套（哈尔滨成功组合）
  reconstruction_weight: 0.1
  consistency_weight: 0.05
  temporal_cosine_pixel_weight: 0.5
  # V21: 关闭raw_uniformity(欧氏空间，方向坍缩时梯度≈0)，改用L2余弦uniformity
  # batch_uniformity_loss_l2: 内部L2归一化→余弦相似度，方向坍缩时梯度O(ε)不消失
  use_pre_norm_uniform: false
  pre_norm_uniform_weight: 0.5      # 已禁用，值保留
  batch_uniformity_weight: 3.0      # V21: L2余弦uniformity，主力反方向坍缩损失

  # ★ VICReg（哈尔滨参数）
  use_spatial_vicreg: true      # V18: spatial_flat [B*H*W, D] N>>D，梯度不被bank稀释
  variance_weight: 0.5          # V19: spatial var保留但降低（InfoNCE是主力）
  covariance_weight: 0.001
  vicreg_min_std: 0.3           # 从1.0降低：pre_norm在L2norm空间std≈0.05-0.15，1.0太高

  # ★ 辅助损失
  classification_weight: 0.03
  orthogonality_weight: 0.01
  decorrelation_weight: 0.1     # V20: 重新启用！spatial_flat [1024,64] N>>D，Barlow Twins稳定
                                # 防止维度间高相关（cov=0.12，erank=2）；v16失败因N=16<D=64

  # ★ V18: inter-sample VICReg（patch间多样性）直接用gathered_pre，无bank稀释
  inter_variance_weight: 1.0    # V19: 降低（InfoNCE是主力，VICReg作为辅助）
  inter_variance_min_std: 0.3   # pre_norm空间合理阈值

  # ★ V19: NT-Xent / InfoNCE inter-patch对比损失（防止方向坍缩核心机制）
  # 原理：完全坍缩时loss=log(N)≈2.77，梯度最大；N=16即可工作（不需要N>>D）
  inter_patch_infonce_weight: 2.0
  inter_patch_infonce_temperature: 0.1

  # ★ 移除PID（所有PID变体失败，根因：完全坍缩态零梯度）
  patch_id_loss_weight: 0.0
  patch_id_num_patches: 320

  # ★ 移除其他不稳定损失
  lmim_weight: 0.0
  temporal_gap_aware_weight: 0.0
  hyperspherical_uniform_weight: 0.0
  spherical_variance_weight: 0.0
  spherical_variance_min_std: 0.1

  # ★ V14: 修复 temporal contrastive（正确参数名 + 适当权重）
  # 解决：v13 temporal=0.0000 因为config使用 temporal_cosine_pixel_weight 而trainer读 temporal_contrastive_weight
  temporal_contrastive_weight: 2.0   # 强信号，在坍缩时提供非零梯度

  # ★ 哈尔滨参数
  decoder_cond_dropout: 0.6
  temporal_magnitude_temperature: 0.1
  temporal_use_spatial_weight: true
  source_recon_weights: [1.0, 1.0, 1.0, 0.05, 0.5]

  # 禁用其他损失（未调优，暂不启用）
  temporal_magnitude_weight: 0.0
  pixel_change_supervision_weight: 0.0
  change_consistency_weight: 0.0
  text_contrastive_weight: 0.0
  vicreg_weight: 0.0
  dino_weight: 0.0
  koleo_weight: 0.0
  pixel_temporal_info_nce_weight: 0.0
  l2_temporal_weight: 0.0
  ct_reconstruction_weight: 0.0
  aux_classification_weight: 0.0
  bottleneck_cls_weight: 0.0
  encoder_uniform_weight: 0.0

  # Teacher-Student
  teacher_momentum: 0.996
  teacher_dropout_rate: 0.1
  student_frame_drop_rate: 0.5
  student_source_drop_rate: 0.3
  student_front_drop_prob: 0.15
  student_back_drop_prob: 0.15

  # Kappa（D=128 维时，需足够大才能保证推理 embedding 方向稳定）
  kappa_start: 8000.0
  kappa_end: 8000.0
  kappa_warmup_epochs: 0

  # 学习率调度（v9: warmup 1 epoch，快速到达峰值 lr）
  lr_schedule: cosine_no_restart
  warmup_epochs: 2               # v13: 2 epoch warmup（统计量修复后稳定启动）
  recon_warmup_epochs: 0

  # 320 patches ÷ batch_size=2 = 160 steps/epoch（保留余量）
  max_steps_per_epoch: 200

  # 保存
  save_every: 20
  save_best_balanced: true
  best_balanced_uniform_min: 0.0
  best_balanced_uniform_max: 0.3
  early_stop_patience: 100

evaluation:
  knn_k: 5
  bootstrap_samples: 100
