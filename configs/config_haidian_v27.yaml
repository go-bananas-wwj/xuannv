# ============================================================
# xuannv 海淀嵌入底座 v25 — 基于调研报告的损失优化
# 创建时间: 2026-05-30
#
# v25 相比 v24 的改动（来自 loss_analysis_20260530.md）：
#   1. 移除 decorrelation_loss（与 covariance_loss 代数等价，冗余）
#   2. 重建损失降权 0.15 → 0.08（MAE重建损失伤害线性探测，参考U-MAE论文）
#   3. MAE mask 比例提高 0.50 → 0.85（提高难度，强迫学习更鲁棒的表示）
#
# v24 失败观察（erank 持续 3.2-8.5）：
#   - decorrelation + covariance 双重梯度冲突
#   - reconstruction_weight=0.15 主导梯度方向，抑制 uniformity
#   - mask 比例过低(50%)导致重建任务太容易，模型偷懒
# ============================================================

experiment:
  name: exp_v27_haidian_antcollapse_0530
  seed: 42
  output_dir: /workspace/xuannv/outputs/exp_v25_haidian_loss_opt_0530

data:
  dataset_type: harbin_patches
  manifest_path: /workspace/xuannv/data_raw/haidian_train
  stats_dir: /workspace/xuannv/statistics/haidian_train
  batch_size: 4
  num_workers: 0
  image_size: 128
  max_frames: 24
  num_samples: 320
  num_classes: 11
  input_dim: 6
  metadata_dim: 4

  # ★ 4 路输入（含天仪 SAR）
  num_input_sources: 4
  input_sources:
    - s2
    - s1
    - landsat
    - tianyi_sar

  source_channels:
    s2: 6
    s1: 2
    landsat: 6
    tianyi_sar: 1

  # 5 个目标源
  num_target_sources: 6
  target_sources:
    - name: s2
      loss_type: 0
      sensor_src: s2
      out_channels: 6
    - name: s1
      loss_type: 0
      sensor_src: s1
      out_channels: 2
    - name: landsat
      loss_type: 0
      sensor_src: landsat
      out_channels: 6
    - name: dem
      loss_type: 0
      sensor_src: null
      out_channels: 1
    - name: worldcover
      loss_type: 1
      sensor_src: null
      out_channels: 11
    - name: dynamic_world
      loss_type: 1        # CrossEntropy, io-lulc 9类
      sensor_src: null
      out_channels: 9

  random_target_frame: true
  spatial_augmentation: true
  temporal_window_augmentation: true
  temporal_window_prob: 0.5
  temporal_window_min_frames: 4
  temporal_window_max_frames: 24
  preload: true

  recon_mask_ratio: 0.85
  recon_mask_patch_size: 16

  filter_2025_monthly: false

model:
  input_dim: 6
  stem_dim: 128
  precision_dim: 128
  time_dim: 256
  space_dim: 256
  embedding_dim: 64
  time_code_dim: 64
  window_code_dim: 64
  relative_time_code_dim: 16
  num_blocks: 8
  num_heads: 8
  vmf_kappa: 8000.0
  bottleneck_noise_scale: 0.02
  metadata_dim: 4
  num_sensor_types: 16
  gradient_checkpointing: true
  per_source_decoders: true
  decoder_hidden_mult: 1
  skip_l2_norm_training: true

training:
  epochs: 80
  gradient_accumulation_steps: 2
  lr: 0.0001
  lr_min: 0.000001
  weight_decay: 0.01
  grad_clip_norm: 1.0

  # ★★★ exp_v2 已验证成功的损失组合（erank=21）★★★
  reconstruction_weight: 0.08        # v25: 0.15→0.08（MAE重建伤害线性探测，参考U-MAE）
  consistency_weight: 0.15          # exp_v2: 0.15（v21用0.05，太低）
  classification_weight: 0.03       # 保持小权重

  # ★ 核心：欧氏空间 pre-norm uniformity（exp_v2 成功关键）
  use_pre_norm_uniform: true        # ← 关键！v21把这个关掉了
  pre_norm_uniform_weight: 1.5      # v27: 0.8→1.5 提升反坍缩力
  batch_uniformity_weight: 0.0      # 关闭L2余弦uniformity（梯度≈0无效）

  # ★ VICReg（exp_v2 参数，covariance=0.1 是关键！）
  use_spatial_vicreg: true
  variance_weight: 0.6              # v27: 0.3→0.6 提升反坍缩力
  covariance_weight: 0.1            # ← 关键！v21降到0.001（降了100倍）
  vicreg_min_std: 1.0               # exp_v2: 1.0（v21用0.3，太低）

  # ★ 辅助反坍缩（exp_v2 参数）
  decorrelation_weight: 0.0          # v25: 移除（与 covariance_loss 代数等价，冗余，Garrido 2023）
  orthogonality_weight: 0.01        # exp_v2: 0.01

  # ★ 关闭所有 v21-v23 新增的复杂损失（已确认被重建梯度压制）
  inter_patch_infonce_weight: 0.0
  inter_patch_infonce_temperature: 0.1
  inter_variance_weight: 0.0
  inter_variance_min_std: 0.3
  inter_decorr_weight: 0.0
  erank_loss_weight: 0.0
  temporal_contrastive_weight: 0.0
  temporal_cosine_pixel_weight: 0.0

  # 关闭其他未验证损失
  patch_id_loss_weight: 0.0
  lmim_weight: 0.0
  temporal_gap_aware_weight: 0.0
  hyperspherical_uniform_weight: 0.0
  spherical_variance_weight: 0.0
  temporal_magnitude_weight: 0.0
  pixel_change_supervision_weight: 0.0
  change_consistency_weight: 0.0
  # Memory Bank — K=1024：N=1040 >> D=64，协方差满秩，staleness 刷新周期=64步
  memory_bank_size: 1024
  text_contrastive_weight: 0.0
  vicreg_weight: 0.0
  dino_weight: 0.0
  koleo_weight: 0.0
  pixel_temporal_info_nce_weight: 0.0
  l2_temporal_weight: 0.0
  ct_reconstruction_weight: 0.0
  aux_classification_weight: 0.0
  bottleneck_cls_weight: 0.0
  encoder_uniform_weight: 0.0

  # 源重建权重（6目标源：s2=1.0, s1=1.0, landsat=1.0, dem=0.02, worldcover=0.1, dynamic_world=0.1）
  # 时序源权重高（主要学习信号），静态标注源权重低（辅助空间先验，避免主导梯度）
  source_recon_weights: [1.0, 1.0, 1.0, 0.02, 0.1, 0.1]

  # Teacher-Student
  teacher_momentum: 0.996
  teacher_dropout_rate: 0.1
  student_frame_drop_rate: 0.5
  student_source_drop_rate: 0.3
  student_front_drop_prob: 0.15
  student_back_drop_prob: 0.15

  # Kappa
  kappa_start: 8000.0
  kappa_end: 8000.0
  kappa_warmup_epochs: 0

  # 学习率调度
  lr_schedule: cosine_no_restart
  warmup_epochs: 10               # exp_v2: 10 epochs（比v1的2更稳定）
  recon_warmup_epochs: 0

  # 320 patches ÷ batch_size=4 = 80 steps/epoch（effective batch=64: 4×8卡×2 accum）
  max_steps_per_epoch: 200

  # 保存
  save_every: 20
  save_best_balanced: true
  best_balanced_uniform_min: 0.0
  best_balanced_uniform_max: 0.3
  early_stop_patience: 100

  decoder_cond_dropout: 0.6
  temporal_magnitude_temperature: 0.1
  temporal_use_spatial_weight: true

evaluation:
  knn_k: 5
  bootstrap_samples: 100
