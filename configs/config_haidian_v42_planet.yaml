# ============================================================
# xuannv 海淀嵌入底座 v42 — 引入 PlanetScope 3m 高分辨率补充源
# 创建时间: 2026-06-16
#
# 基础: v41 (Barlow Twins 硬约束 + VICReg 超权重)
# 变更:
#   - 增加第 5 路输入 planet (4 通道 BGRN, 256x256)
#   - 开启多分辨率输入 (use_multires=true)
#   - 为 planet 指定 source_image_sizes=256 与 stem_stride=4
# ============================================================

experiment:
  name: exp_v42_haidian_planet_0616
  seed: 42
  output_dir: /workspace/xuannv/outputs/exp_v42_haidian_planet_0616

data:
  dataset_type: harbin_patches
  manifest_path: /workspace/xuannv/data_raw/haidian/scenes
  stats_dir: /workspace/xuannv/statistics/haidian
  batch_size: 2
  num_workers: 0
  image_size: 128
  max_frames: 24
  num_samples: 320
  num_classes: 11
  input_dim: 6
  metadata_dim: 4

  # ★ 多分辨率输入
  use_multires: true
  patch_size_m: 1280.0
  source_gsd:
    s2: 10.0
    s1: 10.0
    landsat: 30.0
    tianyi_sar: 10.0
    planet: 3.0

  # 显式指定 planet 输出尺寸，避免按 1280/3 自动计算成 427x427
  source_image_sizes:
    planet: 256

  # ★ 5 路输入（含 PlanetScope）
  num_input_sources: 5
  input_sources:
    - s2
    - s1
    - landsat
    - tianyi_sar
    - planet

  source_channels:
    s2: 6
    s1: 2
    landsat: 6
    tianyi_sar: 1
    planet: 4

  # 6 个目标源（与 v41 一致）
  num_target_sources: 6
  target_sources:
    - name: s2
      loss_type: 0
      sensor_src: s2
      out_channels: 6
    - name: s1
      loss_type: 0
      sensor_src: s1
      out_channels: 2
    - name: landsat
      loss_type: 0
      sensor_src: landsat
      out_channels: 6
    - name: dem
      loss_type: 0
      sensor_src: null
      out_channels: 1
    - name: worldcover
      loss_type: 1
      sensor_src: null
      out_channels: 11
    - name: dynamic_world
      loss_type: 1
      sensor_src: null
      out_channels: 9

  random_target_frame: true
  spatial_augmentation: true
  temporal_window_augmentation: true
  temporal_window_prob: 0.5
  temporal_window_min_frames: 4
  temporal_window_max_frames: 24
  preload: false

  recon_mask_ratio: 0.85
  recon_mask_patch_size: 16

  filter_2025_monthly: false

model:
  input_dim: 6
  stem_dim: 128
  precision_dim: 128
  time_dim: 256
  space_dim: 256
  embedding_dim: 64
  time_code_dim: 64
  window_code_dim: 64
  relative_time_code_dim: 16
  num_blocks: 8
  num_heads: 8
  vmf_kappa: 8000.0
  bottleneck_noise_scale: 0.02
  metadata_dim: 4
  num_sensor_types: 16
  gradient_checkpointing: true
  per_source_decoders: true
  decoder_hidden_mult: 1
  skip_l2_norm_training: true
  use_2d_pos_enc: false
  pos_enc_2d_height: 8
  pos_enc_2d_width: 8

  # ★ 多分辨率模型配置
  common_spatial_size: [64, 64]
  source_stem_stride:
    s2: 2
    s1: 2
    landsat: 1
    tianyi_sar: 2
    planet: 4
  source_stem_layers:
    s2: 1
    s1: 1
    landsat: 1
    tianyi_sar: 1
    planet: 1
  source_channels:
    s2: 6
    s1: 2
    landsat: 6
    tianyi_sar: 1
    planet: 4

training:
  epochs: 40
  gradient_accumulation_steps: 4
  lr: 0.0001
  lr_min: 0.000001
  weight_decay: 0.01
  grad_clip_norm: 1.0

  # ★★★ 核心损失组合 (复用 v41) ★★★
  reconstruction_weight: 0.08
  consistency_weight: 0.0
  classification_weight: 0.03

  decorrelation_weight: 5.0

  use_spatial_vicreg: true
  variance_weight: 2.0
  covariance_weight: 1.0
  vicreg_min_std: 1.0

  orthogonality_weight: 0.01

  use_pre_norm_uniform: false
  pre_norm_uniform_weight: 0.0
  batch_uniformity_weight: 0.0
  erank_loss_weight: 0.0
  aef_batch_uniformity_weight: 0.0

  inter_patch_infonce_weight: 0.0
  inter_patch_infonce_temperature: 0.1
  inter_variance_weight: 0.0
  inter_variance_min_std: 0.3
  inter_decorr_weight: 0.0
  temporal_contrastive_weight: 0.0
  temporal_cosine_pixel_weight: 0.0
  patch_id_loss_weight: 0.0
  lmim_weight: 0.0
  temporal_gap_aware_weight: 0.0
  hyperspherical_uniform_weight: 0.0
  spherical_variance_weight: 0.0
  temporal_magnitude_weight: 0.0
  pixel_change_supervision_weight: 0.0
  change_consistency_weight: 0.0
  text_contrastive_weight: 0.0
  vicreg_weight: 0.0
  dino_weight: 0.0
  koleo_weight: 0.0
  pixel_temporal_info_nce_weight: 0.0
  l2_temporal_weight: 0.0
  ct_reconstruction_weight: 0.0
  aux_classification_weight: 0.0
  bottleneck_cls_weight: 0.0
  encoder_uniform_weight: 0.0

  memory_bank_size: 4096

  source_recon_weights: [1.0, 1.0, 1.0, 0.02, 0.1, 0.1]

  teacher_momentum: 0.996
  teacher_dropout_rate: 0.1
  student_frame_drop_rate: 0.5
  student_source_drop_rate: 0.3
  student_front_drop_prob: 0.15
  student_back_drop_prob: 0.15

  kappa_start: 8000.0
  kappa_end: 8000.0
  kappa_warmup_epochs: 0

  lr_schedule: cosine_no_restart
  warmup_epochs: 10
  recon_warmup_epochs: 0

  max_steps_per_epoch: 200

  save_every: 10
  save_best_balanced: true
  best_balanced_uniform_min: 0.0
  best_balanced_uniform_max: 0.3
  early_stop_patience: 100

  decoder_cond_dropout: 0.6
  temporal_magnitude_temperature: 0.1
  temporal_use_spatial_weight: true

evaluation:
  knn_k: 5
  bootstrap_samples: 100
