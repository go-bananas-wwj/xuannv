# ============================================================
# AEF_qwen V1 — 严格按论文设计: 3类输入, 7类重建目标
# ============================================================
# 输入 (Input): S2 + S1 + Landsat (仅带时间戳的图像帧)
# 目标 (Target): 输入3类 + DEM + WorldCover + Dynamic World + JRC Water = 7类
#
# 数据: 单景影像 (YYYYMMDD)
#   S2: ~180 景/patch, S1: ~96 景/patch, Landsat: ~38 景/patch
#   时间范围: 2023-01 ~ 2026-03
#
# 启动:
#   cd /workspace/xuannv
#   CUDA_VISIBLE_DEVICES=5,6,7 torchrun --nproc_per_node=3 \
#     scripts/train_ddp.py --config configs/qwen_v1_scenes.yaml \
#     --save-every 50 --warmup-epochs 10
# ============================================================

experiment:
  name: aef_qwen_v1
  seed: 42
  output_dir: /workspace/outputs/aef_qwen_v1

data:
  dataset_type: harbin_patches
  # 单景数据路径
  manifest_path: /workspace/raw/harbin_scenes/harbin_scenes
  stats_dir: /workspace/statistics/harbin_scenes
  batch_size: 2
  num_workers: 4
  image_size: 128
  max_frames: 32
  num_samples: 424
  num_classes: 11
  input_dim: 6
  metadata_dim: 4
  num_input_sources: 3          # ★ 仅 S2, S1, Landsat
  num_target_sources: 7         # ★ 输入3类 + DEM + WorldCover + Dynamic World + JRC Water
  random_target_frame: true
  spatial_augmentation: true
  # 时序窗口增强
  temporal_window_augmentation: true
  temporal_window_prob: 0.5
  temporal_window_min_frames: 4
  temporal_window_max_frames: 24
  cloud_filter_threshold: 0.0
  variance_weighted: false
  # 内存预加载: True=启动时全部加载到RAM(快但启动慢), False=按需从磁盘读取(启动快但训练慢)
  preload: true

model:
  input_dim: 6
  stem_dim: 128
  precision_dim: 256
  time_dim: 256
  space_dim: 256
  embedding_dim: 128
  time_code_dim: 64
  window_code_dim: 64
  relative_time_code_dim: 16
  num_blocks: 8
  num_heads: 8
  vmf_kappa: 2000.0
  bottleneck_noise_scale: 0.02
  reconstruction_channels: 6
  metadata_dim: 4
  num_sensor_types: 16
  gradient_checkpointing: true
  per_source_decoders: false
  decoder_hidden_mult: 1
  # ★ 训练时跳过 L2 归一化
  skip_l2_norm_training: true
  spatial_dropout_rate: 0.0

training:
  epochs: 400
  gradient_accumulation_steps: 4
  lr: 0.00005
  weight_decay: 0.01
  grad_clip_norm: 1.0
  teacher_dropout_rate: 0.1
  student_frame_drop_rate: 0.4
  student_source_drop_rate: 0.3
  student_front_drop_prob: 0.2
  student_back_drop_prob: 0.2
  # 损失权重
  reconstruction_weight: 1.0
  uniformity_weight: 0.3        # raw_uniformity (欧氏空间)
  uniformity_adaptive: true
  consistency_weight: 0.0       # 暂时关闭 — 需要 teacher-student 扰动才有效
  classification_weight: 0.0    # 暂时关闭 — label 全为零，无意义
  text_contrastive_weight: 0.0
  # 反坍缩四件套
  orthogonality_weight: 1.0     # Conv1x1 权重正交
  variance_weight: 1.0          # VICReg 方差正则
  decorrelation_weight: 0.01    # Barlow Twins 去相关
  spatial_dropout_rate: 0.0
  bottleneck_cls_weight: 0.0    # 暂时关闭 — label 全为零
  aux_classification_weight: 0.0  # 暂时关闭 — label 全为零
  # 预归一化 uniformity 监控
  pre_norm_uniform_weight: 3.0
  encoder_uniform_weight: 2.0
  # Warmup
  recon_warmup_epochs: 20
  warmup_epochs: 10
  lr_schedule: cosine_no_restart
  # 检查点
  save_best_balanced: true
  best_balanced_uniform_min: -4.0
  best_balanced_uniform_max: -1.0
  early_stop_patience: 150
  save_every: 50
  checkpoint_interval: 20

evaluation:
  knn_k: 5
  bootstrap_samples: 100
