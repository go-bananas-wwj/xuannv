# ============================================================
# AEF_qwen V4 — 变化检测能力升级配置 (Rev B)
# ============================================================
# 2025-04-15 修正:
#   1. 关闭 VICReg (已饱和 ~0.974，不再提供有效梯度)
#   2. temporal loss 同时约束 pre_norm + L2 空间
#   3. 改为 non_overlap 双窗口 (长间隔，信号更强)
#   4. 增大 reconstruction + koleo 权重
#   5. 更保守的 grad_clip (3.0 -> 1.0)
#
# 启动:
#   cd /workspace/xuannv
#   CUDA_VISIBLE_DEVICES=6,7 torchrun --nproc_per_node=2 \
#     scripts/train/train_ddp_v4.py --config configs/qwen_v4_cd_upgrade.yaml \
#     --resume /workspace/outputs/aef_qwen_v4_cd_upgrade/epoch_100.pt
# ============================================================

_base_: qwen_v2_temporal.yaml

experiment:
  name: aef_qwen_v4_cd_upgrade
  output_dir: /workspace/outputs/aef_qwen_v4_cd_upgrade

data:
  # ★ 非重叠长间隔双窗口 — 信号更强
  window_mode: "non_overlap"
  # non_overlap 参数
  non_overlap_min_frames: 4
  non_overlap_max_frames: 12
  non_overlap_min_gap_ms: 15552000000  # 6个月 (ms)

  # ★ 跨时相掩码重建
  ct_mask_ratio: 0.3
  ct_mask_patch_size: 8

  # 时序窗口增强（以月份锚点为中心 ±7 天扰动）
  temporal_window_augmentation: true
  temporal_window_prob: 0.5
  temporal_window_min_frames: 4
  temporal_window_max_frames: 12

training:
  epochs: 200

  # 梯度累积: batch=2 * 2GPU * accum=8 = effective batch=32
  gradient_accumulation_steps: 8

  # ★ EMA Teacher
  teacher_momentum: 0.996

  # ★ DINO/iBOT — 已移除
  dino_weight: 0.0

  # ★ VICReg — 已饱和，关闭
  vicreg_weight: 0.0
  koleo_weight: 0.15       # 增大推力
  expander_dim: 512        # expander 保留给 KoLeo 用

  # ★ 跨时相掩码重建
  ct_reconstruction_weight: 0.5

  # 旧损失权重（全部关闭）
  uniformity_weight: 0.0
  decorrelation_weight: 0.0
  variance_weight: 0.0
  orthogonality_weight: 0.0
  consistency_weight: 0.0

  # 保留重建 + 时序对比（权重增大）
  reconstruction_weight: 1.0
  temporal_contrastive_weight: 1.0
  temporal_margin: 1.0                     # L2 distance hinge margin
  l2_temporal_weight: 0.5                 # L2 空间 temporal 约束权重

  # 学习率
  lr: 0.0001
  warmup_epochs: 5          # 缩短 warmup，更快进入正轨
  recon_warmup_epochs: 5
  save_every: 20
  grad_clip_norm: 1.0       # 更保守的裁剪，防止 KoLeo 发散
