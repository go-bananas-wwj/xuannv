# ============================================================
# AEF_qwen V4 — 变化检测能力升级配置
# ============================================================
# 核心升级:
#   1. 相邻月份双窗口采样 (window_mode: adjacent_month)
#   2. 跨时相掩码重建 (ct_mask_ratio: 0.3)
#   3. EMA Teacher + DINO 自蒸馏
#   4. VICReg + KoLeo 反坍缩正则
#   5. 单卡训练 (GPU6, batch=2, accum=8)
#
# 启动:
#   cd /workspace/xuannv
#   CUDA_VISIBLE_DEVICES=6 python scripts/train/train_single_gpu.py \
#     --config configs/qwen_v4_cd_upgrade.yaml \
#     --resume /workspace/outputs/aef_qwen_v2/epoch_499.pt
# ============================================================

_base_: qwen_v2_temporal.yaml

experiment:
  name: aef_qwen_v4_cd_upgrade
  output_dir: /workspace/outputs/aef_qwen_v4_cd_upgrade

data:
  # ★ 相邻月份双窗口 — 与下游月度变化检测对齐
  window_mode: "adjacent_month"

  # ★ 跨时相掩码重建
  ct_mask_ratio: 0.3
  ct_mask_patch_size: 8

  # 时序窗口增强（以月份锚点为中心 ±7 天扰动）
  temporal_window_augmentation: true
  temporal_window_prob: 0.5
  temporal_window_min_frames: 4
  temporal_window_max_frames: 12

training:
  epochs: 200

  # 单卡梯度累积: batch=2 * accum=8 = effective batch=16
  gradient_accumulation_steps: 8

  # ★ EMA Teacher
  teacher_momentum: 0.996

  # ★ DINO/iBOT
  dino_weight: 0.1

  # ★ VICReg + KoLeo（替换旧反坍缩四件套）
  vicreg_weight: 1.0
  koleo_weight: 0.05
  expander_dim: 512

  # ★ 跨时相掩码重建
  ct_reconstruction_weight: 0.5

  # 旧损失权重（可设为 0 以完全切换到新损失）
  uniformity_weight: 0.0
  decorrelation_weight: 0.0
  variance_weight: 0.0
  orthogonality_weight: 0.0
  consistency_weight: 0.0

  # 保留重建 + 时序对比
  reconstruction_weight: 0.5
  temporal_contrastive_weight: 0.5
  temporal_contrastive_temperature: 0.1
  temporal_loss_type: info_nce_antidiagonal

  # 学习率（effective batch=32，但 NaN 历史要求保守）
  lr: 0.00005
  warmup_epochs: 10
  recon_warmup_epochs: 10
  save_every: 20
  grad_clip_norm: 3.0
