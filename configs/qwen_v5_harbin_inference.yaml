# ============================================================
# V5 Mixed Scale — 哈尔滨推理专用配置
# ============================================================
# 基于 V5 训练配置，修改数据路径为当前实际目录
# 用于月度嵌入提取和变化检测推理
# ============================================================

_base_: qwen_v5_mixed_scale.yaml

experiment:
  name: aef_qwen_v5_harbin_inference
  output_dir: /workspace/outputs/aef_qwen_v5_mixed_scale

data:
  # 修正为实际数据路径
  manifest_path: /workspace/raw/harbin_scenes
  stats_dir: /workspace/statistics/harbin_scenes
  # 推理时不需要预加载全部数据到内存
  preload: false
  # 推理时不需要数据增强
  spatial_augmentation: false
  temporal_window_augmentation: false
