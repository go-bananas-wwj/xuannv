# Exp3: Spatial Raw Uniformity (在map上算，不取GMP)
# 核心: use_spatial_raw_uniformity=True
_base_: ../v12_expB_inter01.yaml
experiment:
  name: round7_exp3_spatial_raw_unif
  output_dir: /workspace/outputs/round7_exp3_spatial_raw_unif
  seed: 103

model:
  skip_l2_norm_training: true

training:
  epochs: 50
  reconstruction_weight: 0.1
  consistency_weight: 0.0
  inter_variance_weight: 0.0
  classification_weight: 0.0
  decorrelation_weight: 0.0
  orthogonality_weight: 0.1
  batch_uniformity_weight: 0.0
  use_spatial_raw_uniformity: true
  pre_norm_uniform_weight: 0.5
  variance_weight: 0.3
  covariance_weight: 0.1
  vicreg_min_std: 0.1
  save_every: 5
