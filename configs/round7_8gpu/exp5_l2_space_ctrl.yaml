# Exp5: L2-space对照组（skip_l2=False）
# 预期: 可能出现坍缩
_base_: ../v12_expB_inter01.yaml
experiment:
  name: round7_exp5_l2_space_ctrl
  output_dir: /workspace/outputs/round7_exp5_l2_space_ctrl
  seed: 105

model:
  skip_l2_norm_training: false
  active_dims_threshold: 0.05  # L2 空间用标准阈值

training:
  active_dims_threshold: 0.05  # L2 空间用标准阈值
  epochs: 50
  reconstruction_weight: 0.1
  consistency_weight: 0.0
  inter_variance_weight: 0.0
  classification_weight: 0.0
  decorrelation_weight: 0.0
  orthogonality_weight: 0.0
  batch_uniformity_weight: 0.1
  use_pre_norm_uniform: false
  pre_norm_uniform_weight: 0.0
  variance_weight: 0.3
  covariance_weight: 0.1
  vicreg_min_std: 0.1
  save_every: 5
