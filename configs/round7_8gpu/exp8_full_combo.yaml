# Exp8: Full Combo — 所有有效策略的组合
# 核心: pre_norm_unif=0.3 + orth=0.1 + spatial_vicreg + var=0.3
_base_: ../v12_expB_inter01.yaml
experiment:
  name: round7_exp8_full_combo
  output_dir: /workspace/outputs/round7_exp8_full_combo
  seed: 108

model:
  skip_l2_norm_training: true
  active_dims_threshold: 0.15  # pre-norm 空间用更高阈值

training:
  active_dims_threshold: 0.15  # pre-norm 空间用更高阈值
  epochs: 50
  reconstruction_weight: 0.1
  consistency_weight: 0.0
  inter_variance_weight: 0.0
  classification_weight: 0.0
  decorrelation_weight: 0.0
  orthogonality_weight: 0.1
  batch_uniformity_weight: 0.0
  use_pre_norm_uniform: true
  pre_norm_uniform_weight: 0.3
  variance_weight: 0.3
  covariance_weight: 0.1
  vicreg_min_std: 0.1
  use_spatial_vicreg: true
  save_every: 5
