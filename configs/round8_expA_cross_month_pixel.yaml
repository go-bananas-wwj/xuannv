# Round8 ExpA: 跨月窗口 + 像素级时序损失
_base_: v12_expB_inter01.yaml

experiment:
  name: round8_expA_cross_month_pixel
  output_dir: /workspace/outputs/round8_expA_cross_month_pixel
  seed: 201

data:
  window_mode: "non_overlap"
  non_overlap_min_frames: 4
  non_overlap_max_frames: 12
  non_overlap_min_gap_ms: 15552000000  # 6个月

model:
  skip_l2_norm_training: true
  vmf_kappa: 50.0

training:
  epochs: 20
  reconstruction_weight: 0.1
  consistency_weight: 0.0
  classification_weight: 0.0
  decorrelation_weight: 0.0
  orthogonality_weight: 0.1
  pre_norm_uniform_weight: 0.5
  variance_weight: 0.3
  covariance_weight: 0.1
  vicreg_min_std: 0.1
  temporal_cosine_pixel_weight: 0.5
  temporal_magnitude_temperature: 0.1
  save_every: 5
  max_steps_per_epoch: 100
