# Round8 ExpD: 渐进 Kappa 15→100（其他同 C）
_base_: v12_expB_inter01.yaml

experiment:
  name: round8_expD_progressive_kappa
  output_dir: /workspace/outputs/round8_expD_progressive_kappa
  seed: 204

data:
  window_mode: "non_overlap"
  non_overlap_min_frames: 4
  non_overlap_max_frames: 12
  non_overlap_min_gap_ms: 15552000000  # 6个月

model:
  skip_l2_norm_training: true
  vmf_kappa: 100.0

training:
  epochs: 20
  reconstruction_weight: 0.1
  consistency_weight: 0.05
  classification_weight: 0.03
  decorrelation_weight: 0.05
  orthogonality_weight: 0.01
  pre_norm_uniform_weight: 0.5
  variance_weight: 0.25
  covariance_weight: 0.04
  vicreg_min_std: 1.0
  temporal_cosine_pixel_weight: 0.5
  temporal_magnitude_temperature: 0.1
  save_every: 5
  max_steps_per_epoch: 50
