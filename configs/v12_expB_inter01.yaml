# ExpB: recon=0.05 + 轻量样本间约束 (inter_var=0.1)
_base_: xuannv_v12_clean.yaml
experiment:
  name: v12_expB_inter01
  output_dir: /workspace/outputs/v12_expB_inter01
  seed: 43
training:
  epochs: 50
  lr: 0.0001
  lr_min: 0.000001
  warmup_epochs: 10
  recon_warmup_epochs: 0
  reconstruction_weight: 0.05
  use_spatial_vicreg: true
  variance_weight: 0.3
  covariance_weight: 0.1
  vicreg_min_std: 1.0
  inter_variance_weight: 0.1
  inter_variance_min_std: 0.3
  consistency_weight: 0.05
  classification_weight: 0.03
  decorrelation_weight: 0.05
  orthogonality_weight: 0.01
  batch_uniformity_weight: 0.0
  teacher_momentum: 0.996
  student_frame_drop_rate: 0.5
  student_source_drop_rate: 0.3
  save_every: 5
  max_steps_per_epoch: 100
  save_best_balanced: true
