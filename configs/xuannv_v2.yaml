# ============================================================
# 玄女V2 — 严格对齐AEF论文 STP Block 架构
# 核心: 三条独立路径(1024/512/128) + 跨尺度信息传递 + 15 blocks
# ============================================================

experiment:
  name: xuannv_v2
  seed: 42
  output_dir: /workspace/outputs/xuannv_v2

data:
  dataset_type: harbin_patches
  manifest_path: /workspace/raw/phase1_harbin/harbin_scenes_cloud_filtered
  stats_dir: /workspace/statistics/harbin_scenes
  batch_size: 4
  num_workers: 0
  image_size: 128
  max_frames: 32
  num_samples: 424
  num_classes: 11
  input_dim: 6
  metadata_dim: 4
  num_input_sources: 3
  num_target_sources: 4
  random_target_frame: true
  spatial_augmentation: true
  temporal_window_augmentation: true
  temporal_window_prob: 0.5
  temporal_window_min_frames: 4
  temporal_window_max_frames: 24
  preload: true

  # 每个源的实际通道数（输入编码用）
  source_channels:
    s2: 6
    s1: 2
    landsat: 6

  # 目标源配置：S2+S1+Landsat+DEM
  target_sources:
    - name: s2
      loss_type: 0        # 0=continuous (L1)
      sensor_src: s2
      out_channels: 6
    - name: s1
      loss_type: 0
      sensor_src: s1
      out_channels: 2
    - name: landsat
      loss_type: 0
      sensor_src: landsat
      out_channels: 6
    - name: dem
      loss_type: 0
      sensor_src: null
      out_channels: 1

model:
  input_dim: 6
  stem_dim: 128
  precision_dim: 128        # 论文 d_p
  time_dim: 512             # 论文 d_t
  space_dim: 1024           # 论文 d_s
  embedding_dim: 64         # 论文 embedding_dim
  time_code_dim: 64
  window_code_dim: 64
  relative_time_code_dim: 16
  num_blocks: 15            # 论文 15 blocks
  num_heads: 8
  vmf_kappa: 8000.0         # 论文 κ
  bottleneck_noise_scale: 0.02
  metadata_dim: 4
  num_sensor_types: 16
  gradient_checkpointing: true
  per_source_decoders: true
  decoder_hidden_mult: 1
  skip_l2_norm_training: false
  reconstruction_channels: 6

training:
  epochs: 200
  gradient_accumulation_steps: 1
  lr: 0.0001
  weight_decay: 0.01
  grad_clip_norm: 1.0

  # 论文核心损失: recon + uniformity + consistency
  reconstruction_weight: 1.0
  consistency_weight: 0.15
  batch_uniformity_weight: 0.1

  # VICReg (样本间方差+协方差) — 论文未提及但有助于反坍缩
  variance_weight: 0.3
  covariance_weight: 0.1
  vicreg_min_std: 1.0

  # 源特定重建权重
  source_recon_weights: [1.0, 1.0, 1.0, 0.05]  # S2, S1, Landsat, DEM

  # ★ 禁用所有论文未提及的复杂损失
  temporal_gap_aware_weight: 0.0
  temporal_gap_aware_weight_end: 0.0
  temporal_gap_aware_weight_ramp_epochs: 0
  temporal_gap_aware_warmup_epochs: 0
  pixel_change_supervision_weight: 0.0
  pixel_change_supervision_warmup_epochs: 0
  change_consistency_weight: 0.0
  change_consistency_warmup_epochs: 0
  classification_weight: 0.0
  decorrelation_weight: 0.0
  orthogonality_weight: 0.0
  text_contrastive_weight: 0.0
  vicreg_weight: 0.0
  dino_weight: 0.0
  koleo_weight: 0.0
  temporal_magnitude_weight: 0.0
  temporal_cosine_pixel_weight: 0.0
  pixel_temporal_info_nce_weight: 0.0
  l2_temporal_weight: 0.0
  ct_reconstruction_weight: 0.0
  aux_classification_weight: 0.0
  bottleneck_cls_weight: 0.0
  pre_norm_uniform_weight: 0.0
  encoder_uniform_weight: 0.0
  inter_variance_weight: 0.0
  inter_variance_min_std: 0.3

  # Teacher-Student（AEF核心机制）
  teacher_momentum: 0.996
  teacher_dropout_rate: 0.1
  student_frame_drop_rate: 0.5
  student_source_drop_rate: 0.3
  student_front_drop_prob: 0.15
  student_back_drop_prob: 0.15

  # Kappa
  kappa_start: 8000.0
  kappa_end: 8000.0
  kappa_warmup_epochs: 0

  # 学习率调度
  lr_min: 0.00001
  warmup_epochs: 10
  recon_warmup_epochs: 10
  lr_schedule: cosine_no_restart

  # 每 epoch 最大步数（抽样训练，加速迭代）
  max_steps_per_epoch: 100

  # 保存
  save_every: 20
  save_best_balanced: true
  best_balanced_uniform_min: -0.6
  best_balanced_uniform_max: 0.3
  early_stop_patience: 100

evaluation:
  knn_k: 5
  bootstrap_samples: 100
