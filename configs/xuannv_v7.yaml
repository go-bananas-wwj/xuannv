# ============================================================
# 玄女 Backbone V7 — Phase 1 完整训练配置
# 10 blocks (前2禁用Space) + VICReg + KoLeo
# 4卡 DDP, effective batch=64, 从头训练
# ============================================================

experiment:
  name: xuannv_backbone_v7_temporal
  seed: 42
  output_dir: /workspace/outputs/xuannv_backbone_v7_temporal

data:
  dataset_type: harbin_patches
  manifest_path: /workspace/raw/harbin_scenes/harbin_scenes_cloud_filtered
  stats_dir: /workspace/statistics/harbin_scenes
  batch_size: 2
  num_workers: 4
  image_size: 128
  max_frames: 32
  num_samples: 424
  num_classes: 11
  input_dim: 6
  metadata_dim: 4
  num_input_sources: 3
  num_target_sources: 7
  random_target_frame: true
  spatial_augmentation: true
  temporal_window_augmentation: true
  temporal_window_prob: 0.5
  temporal_window_min_frames: 4
  temporal_window_max_frames: 24
  cloud_filter_threshold: 0.0
  variance_weighted: false
  preload: true

model:
  input_dim: 6
  stem_dim: 128
  precision_dim: 256
  time_dim: 256
  space_dim: 256
  embedding_dim: 64
  time_code_dim: 64
  window_code_dim: 64
  relative_time_code_dim: 16
  num_blocks: 6
  num_blocks_disable_space: 1
  num_heads: 8
  vmf_kappa: 2000.0
  bottleneck_noise_scale: 0.02
  reconstruction_channels: 6
  metadata_dim: 4
  num_sensor_types: 16
  gradient_checkpointing: true
  per_source_decoders: false
  decoder_hidden_mult: 1
  skip_l2_norm_training: true
  spatial_dropout_rate: 0.0

training:
  epochs: 400
  gradient_accumulation_steps: 8
  lr: 0.0001
  weight_decay: 0.05
  grad_clip_norm: 1.0
  teacher_dropout_rate: 0.1
  student_frame_drop_rate: 0.2
  student_source_drop_rate: 0.15
  student_front_drop_prob: 0.1
  student_back_drop_prob: 0.1
  
  # VICReg + KoLeo
  vicreg_weight: 2.0
  vicreg_lambda_var: 1.0
  vicreg_lambda_cov: 0.02
  koleo_weight: 0.5
  vicreg_temporal_dropout: 0.15
  vicreg_gamma: 1.0
  
  # EMA Teacher
  teacher_momentum: 0.996
  
  # 四件套置0
  uniformity_weight: 0.0
  uniformity_adaptive: true
  variance_weight: 0.0
  decorrelation_weight: 0.0
  orthogonality_weight: 0.0
  pre_norm_uniform_weight: 0.0
  encoder_uniform_weight: 0.0
  
  # 保留损失
  reconstruction_weight: 1.0
  consistency_weight: 0.01   # 降低 consistency，避免压制时间差异
  classification_weight: 0.03
  aux_classification_weight: 0.0
  bottleneck_cls_weight: 0.0
  text_contrastive_weight: 0.0
  
  # 时序损失
  temporal_magnitude_weight: 0.3   # 启用 pixel-level temporal cosine loss
  temporal_max_gap_ms: 47347200000
  temporal_margin: 0.0
  temporal_cosine_pixel_weight: 0.0
  pixel_temporal_info_nce_weight: 0.0
  
  # Warmup
  recon_warmup_epochs: 10
  warmup_epochs: 20
  lr_schedule: cosine_no_restart
  lr_min: 0.000001
  
  # 检查点
  save_best_balanced: true
  best_balanced_uniform_min: -4.0
  best_balanced_uniform_max: -1.0
  early_stop_patience: 400
  save_every: 20
  checkpoint_interval: 20

evaluation:
  knn_k: 5
  bootstrap_samples: 100
