experiment:
  name: aef_qwen_v2_hr_only_small
  seed: 42
  output_dir: /workspace/outputs/aef_qwen_v2_hr_only_small

data:
  dataset_type: harbin_patches
  manifest_path: /workspace/raw/harbin_scenes
  stats_dir: /workspace/statistics/harbin_scenes
  batch_size: 4
  num_workers: 4
  image_size: 128
  max_frames: 32
  num_samples: 424
  num_classes: 11
  input_dim: 6
  metadata_dim: 4
  num_input_sources: 2          # 仅 s2_hr, s1_hr
  num_target_sources: 4         # s2_hr, s1_hr, dem, worldcover
  random_target_frame: true
  spatial_augmentation: true
  temporal_window_augmentation: true
  temporal_window_prob: 0.5
  temporal_window_min_frames: 4
  temporal_window_max_frames: 24
  non_overlapping_windows: true
  cloud_filter_threshold: 0.0
  variance_weighted: false
  filter_2025_monthly: true
  merge_hr_into_lr: false
  source_channels:
    s2_hr: 6
    s1_hr: 1
  # ★ 关键: 只使用 HR 作为输入
  input_sources:
    - s2_hr
    - s1_hr
  # ★ 关键: 只使用少量目标做重建
  target_sources:
    - {name: s2_hr, loss_type: 0, sensor_src: s2_hr}
    - {name: s1_hr, loss_type: 0, sensor_src: s1_hr}
    - {name: dem, loss_type: 0, sensor_src: dem}
    - {name: worldcover, loss_type: 1, sensor_src: worldcover}

model:
  input_dim: 6
  stem_dim: 64
  precision_dim: 128
  time_dim: 128
  space_dim: 128
  embedding_dim: 64
  time_code_dim: 32
  window_code_dim: 32
  relative_time_code_dim: 8
  num_blocks: 4
  num_heads: 4
  vmf_kappa: 2000.0
  bottleneck_noise_scale: 0.02
  reconstruction_channels: 6
  metadata_dim: 4
  num_sensor_types: 16
  gradient_checkpointing: true
  per_source_decoders: false
  decoder_hidden_mult: 1
  skip_l2_norm_training: true
  spatial_dropout_rate: 0.0
  stem_channels: 6
  source_channels:
    s2_hr: 6
    s1_hr: 1

training:
  epochs: 200
  gradient_accumulation_steps: 2
  lr: 0.00005
  weight_decay: 0.01
  grad_clip_norm: 1.0
  teacher_dropout_rate: 0.1
  student_frame_drop_rate: 0.4
  student_source_drop_rate: 0.3
  lr_schedule: cosine_no_restart
  warmup_epochs: 5
  recon_warmup_epochs: 10
  save_every: 20
  checkpoint_interval: 20
  early_stop_patience: 150
  # 损失权重
  reconstruction_weight: 1.0
  uniformity_weight: 1.0
  pre_norm_uniform_weight: 5.0
  encoder_uniform_weight: 3.0
  decorrelation_weight: 0.01
  variance_weight: 2.0
  orthogonality_weight: 2.0
  consistency_weight: 0.0
  classification_weight: 0.0
  aux_classification_weight: 0.0
  bottleneck_cls_weight: 0.0
  # ★ 时序对比损失 (核心修复: Anti-Diagonal InfoNCE)
  temporal_contrastive_weight: 5.0
  temporal_contrastive_temperature: 0.05
  temporal_loss_type: info_nce_antidiagonal
  pixel_temporal_weight: 3.0
  pixel_temporal_samples: 16
  # best 保存阈值
  save_best_balanced: true
  best_balanced_uniform_min: -4.0
  best_balanced_uniform_max: -1.0
