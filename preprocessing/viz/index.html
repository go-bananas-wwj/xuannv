<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patch 划分可视化 — 玄女底座</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }

  /* ── 顶部导航 ── */
  header { background: #1e293b; border-bottom: 1px solid #334155;
           padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  header h1 { font-size: 16px; font-weight: 700; color: #f1f5f9;
              letter-spacing: 0.02em; }
  header h1 span { color: #38bdf8; }
  .region-tabs { display: flex; gap: 6px; margin-left: 8px; }
  .tab-btn {
    padding: 5px 14px; border-radius: 6px; border: 1px solid #475569;
    background: transparent; color: #94a3b8; font-size: 13px; cursor: pointer;
    transition: all 0.15s;
  }
  .tab-btn:hover { border-color: #38bdf8; color: #38bdf8; }
  .tab-btn.active { background: #0ea5e9; border-color: #0ea5e9; color: #fff; font-weight: 600; }
  .header-stats { margin-left: auto; display: flex; gap: 20px; font-size: 12px; color: #64748b; }
  .header-stats span { color: #94a3b8; }
  .header-stats b { color: #38bdf8; }

  /* ── 主体：左侧信息栏 + 右侧地图 ── */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* ── 左侧信息面板 ── */
  .sidebar {
    width: 280px; flex-shrink: 0; background: #1e293b;
    border-right: 1px solid #334155; overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .panel-section { padding: 14px 16px; border-bottom: 1px solid #1e293b40; }
  .panel-section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
                       color: #475569; margin-bottom: 10px; }
  .stat-row { display: flex; justify-content: space-between; align-items: center;
              padding: 4px 0; font-size: 13px; }
  .stat-label { color: #64748b; }
  .stat-value { color: #e2e8f0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat-value.highlight { color: #38bdf8; }
  .bbox-text { font-size: 11px; color: #64748b; font-family: monospace; line-height: 1.6; }

  /* SAR 站点图例 */
  .sar-legend { margin-top: 6px; }
  .sar-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; color: #94a3b8; }
  .sar-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  /* 选中 patch 详情 */
  .patch-detail { padding: 12px 16px; border-top: 1px solid #334155; margin-top: auto; }
  .patch-detail h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
                      color: #475569; margin-bottom: 8px; }
  .patch-detail.empty p { color: #475569; font-size: 12px; font-style: italic; }
  .coord-pair { font-size: 11px; font-family: monospace; color: #7dd3fc; line-height: 1.8; }

  /* ── 地图 ── */
  #map { flex: 1; z-index: 1; }

  /* 加载遮罩 */
  #loading {
    position: fixed; inset: 0; background: #0f172a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 9999; gap: 16px;
  }
  #loading .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid #334155; border-top-color: #38bdf8;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: #94a3b8; font-size: 14px; }

  /* 工具提示 */
  .leaflet-popup-content-wrapper { background: #1e293b; border: 1px solid #334155;
    color: #e2e8f0; border-radius: 8px; box-shadow: 0 4px 24px #00000060; }
  .leaflet-popup-tip { background: #1e293b; }
  .popup-title { font-weight: 700; color: #38bdf8; font-size: 14px; margin-bottom: 4px; }
  .popup-sub { font-size: 12px; color: #94a3b8; margin: 2px 0; }
  .popup-coords { font-size: 11px; font-family: monospace; color: #7dd3fc; margin-top: 6px; }

  /* 底部状态栏 */
  .statusbar { background: #1e293b; border-top: 1px solid #334155;
    padding: 5px 16px; font-size: 11px; color: #475569;
    display: flex; gap: 20px; flex-shrink: 0; }
  .statusbar span { color: #64748b; }
  .statusbar b { color: #94a3b8; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p id="loading-text">正在加载区域数据…</p>
</div>

<header>
  <h1>玄女底座 · <span>Patch 划分可视化</span></h1>
  <div class="region-tabs" id="region-tabs"></div>
  <div class="header-stats" id="header-stats">
    <div>总 Patches: <b id="hs-total">—</b></div>
    <div>当前区域: <span id="hs-region">—</span></div>
    <div>Patch 边长: <b>1280 m</b></div>
  </div>
</header>

<div class="main">
  <div class="sidebar">
    <div class="panel-section">
      <h3>区域统计</h3>
      <div class="stat-row"><span class="stat-label">总 Patches</span>
        <span class="stat-value highlight" id="s-total">—</span></div>
      <div class="stat-row"><span class="stat-label">坐标系</span>
        <span class="stat-value" id="s-crs">—</span></div>
      <div class="stat-row"><span class="stat-label">Patch 边长</span>
        <span class="stat-value">1280 m</span></div>
      <div class="stat-row"><span class="stat-label">像素分辨率</span>
        <span class="stat-value">128 × 128 px (10 m/px)</span></div>
    </div>
    <div class="panel-section">
      <h3>覆盖范围 (WGS84)</h3>
      <div class="bbox-text" id="s-bbox">—</div>
    </div>
    <div class="panel-section" id="sar-panel" style="display:none">
      <h3>SAR 数据点位</h3>
      <div class="sar-legend" id="sar-legend"></div>
    </div>
    <div class="panel-section">
      <h3>视图操作</h3>
      <div style="font-size:12px;color:#64748b;line-height:1.8;">
        🖱️ 点击 Patch → 查看详情<br>
        🔍 滚轮缩放 / 拖动平移<br>
        📐 缩放 ≥13 显示 Patch 边界
      </div>
    </div>
    <div class="patch-detail empty" id="patch-detail">
      <h3>选中 Patch</h3>
      <p>点击地图上的 Patch 矩形</p>
    </div>
  </div>

  <div id="map"></div>
</div>

<div class="statusbar">
  <div>可见 Patches: <b id="sb-visible">—</b></div>
  <div>地图中心: <b id="sb-center">—</b></div>
  <div>缩放级别: <b id="sb-zoom">—</b></div>
</div>

<script>
// ─── 数据加载 ───────────────────────────────────────────────────────────────
const DATA_DIR = './data/';
let allRegions = [];       // index.json 内容
let currentRegion = null;  // 当前选中的区域数据
let patchLayers = null;    // Leaflet LayerGroup
let sarLayers = null;      // SAR 点位框
let selectedLayer = null;

// ─── 地图初始化 ──────────────────────────────────────────────────────────────
const map = L.map('map', {
  center: [45.9, 126.5],
  zoom: 9,
  preferCanvas: true,       // Canvas 渲染，性能更好
  zoomControl: true,
});

// 高德底图（卫星 + 标注）
const AMapSat = L.tileLayer(
  'https://webst01.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
  { attribution: '© 高德地图', maxZoom: 18, subdomains: ['01','02','03','04'] }
);
const AMapLabel = L.tileLayer(
  'https://webst01.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}',
  { attribution: '', maxZoom: 18, opacity: 0.85, subdomains: ['01','02','03','04'] }
);
// OSM 作为备用
const OSM = L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { attribution: '© OpenStreetMap contributors', maxZoom: 19 }
);
// 天地图卫星
const TDTSat = L.tileLayer(
  'https://t{s}.tianditu.gov.cn/img_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=img&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=您的密钥',
  { subdomains: ['0','1','2','3','4','5','6','7'], maxZoom: 18, attribution: '© 天地图' }
);

AMapSat.addTo(map);
AMapLabel.addTo(map);

L.control.layers(
  { '高德卫星': AMapSat, 'OpenStreetMap': OSM },
  { '路网标注': AMapLabel },
  { position: 'topright' }
).addTo(map);

map.on('moveend zoomend', updateStatusBar);
map.on('moveend zoomend', updateVisibleCount);
updateStatusBar();

// ─── patch 颜色 ──────────────────────────────────────────────────────────────
const COLORS = {
  harbin:        { fill: '#0ea5e9', stroke: '#0284c7' },
  harbin_newarea:{ fill: '#10b981', stroke: '#059669' },
  haidian:       { fill: '#8b5cf6', stroke: '#7c3aed' },
};
function regionColor(name) {
  return COLORS[name] || { fill: '#f59e0b', stroke: '#d97706' };
}

// ─── 图层渲染 ────────────────────────────────────────────────────────────────
function renderPatches(regionData) {
  if (patchLayers) map.removeLayer(patchLayers);
  if (sarLayers)   map.removeLayer(sarLayers);
  selectedLayer = null;

  const col = regionColor(regionData.region_name);
  const zoom = map.getZoom();
  const renderer = L.canvas({ padding: 0.5 });

  patchLayers = L.layerGroup();

  // 补丁数大于 500 时，缩放 < 11 时只绘制中心点
  const patches = regionData.patches;

  patches.forEach(p => {
    const [pw, ps, pe, pn] = p.bounds_wgs84;
    const rect = L.rectangle(
      [[ps, pw], [pn, pe]],
      {
        renderer,
        color: col.stroke,
        weight: 1,
        fillColor: col.fill,
        fillOpacity: 0.15,
        className: 'patch-rect',
      }
    );

    rect._patchData = p;
    rect.on('click', (e) => {
      L.DomEvent.stopPropagation(e);
      onPatchClick(rect, p, col);
    });
    rect.on('mouseover', () => {
      if (rect !== selectedLayer)
        rect.setStyle({ fillOpacity: 0.40, weight: 1.5 });
    });
    rect.on('mouseout', () => {
      if (rect !== selectedLayer)
        rect.setStyle({ fillOpacity: 0.15, weight: 1 });
    });
    patchLayers.addLayer(rect);
  });

  patchLayers.addTo(map);

  // SAR 点位叠加
  const sarSites = regionData.sar_sites;
  if (sarSites) {
    sarLayers = L.layerGroup();
    Object.entries(sarSites).forEach(([name, site]) => {
      const [sw, ss, se, sn] = site.bbox_wgs84;
      const rect = L.rectangle([[ss, sw], [sn, se]], {
        color: site.color,
        weight: 2,
        dashArray: '6 4',
        fill: false,
      });
      rect.bindTooltip(name, { sticky: true, className: 'sar-tooltip' });
      sarLayers.addLayer(rect);
    });
    sarLayers.addTo(map);
    renderSarLegend(sarSites);
    document.getElementById('sar-panel').style.display = '';
  } else {
    document.getElementById('sar-panel').style.display = 'none';
  }

  updateVisibleCount();
}

function onPatchClick(layer, patch, col) {
  if (selectedLayer && selectedLayer !== layer) {
    selectedLayer.setStyle({ fillOpacity: 0.15, weight: 1, color: col.stroke });
  }
  selectedLayer = layer;
  layer.setStyle({ fillOpacity: 0.55, weight: 2.5, color: '#f8fafc' });

  const [pw, ps, pe, pn] = patch.bounds_wgs84;
  const [lon, lat] = patch.center_lonlat;
  const el = document.getElementById('patch-detail');
  el.classList.remove('empty');
  el.innerHTML = `
    <h3>选中 Patch</h3>
    <div class="stat-row">
      <span class="stat-label">编号</span>
      <span class="stat-value highlight">#${patch.id}</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">中心经度</span>
      <span class="coord-pair">${lon.toFixed(5)}°</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">中心纬度</span>
      <span class="coord-pair">${lat.toFixed(5)}°</span>
    </div>
    <div style="margin-top:8px;font-size:11px;color:#64748b">WGS84 bounds:</div>
    <div class="coord-pair">
      W: ${pw.toFixed(5)}°  E: ${pe.toFixed(5)}°<br>
      S: ${ps.toFixed(5)}°  N: ${pn.toFixed(5)}°
    </div>`;
}

// ─── 区域切换 ────────────────────────────────────────────────────────────────
function switchRegion(regionName) {
  const reg = allRegions.find(r => r.region === regionName);
  if (!reg) return;

  document.querySelectorAll('.tab-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.region === regionName));

  document.getElementById('loading-text').textContent = `正在加载 ${reg.display}…`;
  document.getElementById('loading').style.display = 'flex';

  fetch(DATA_DIR + regionName + '_patches.json')
    .then(r => r.json())
    .then(data => {
      currentRegion = data;
      renderPatches(data);
      updateSidebar(data);

      const [bw, bs, be, bn] = data.overall_bbox_wgs84;
      map.fitBounds([[bs, bw], [bn, be]], { padding: [30, 30], maxZoom: 13 });
      document.getElementById('loading').style.display = 'none';
      document.getElementById('patch-detail').classList.add('empty');
      document.getElementById('patch-detail').innerHTML =
        '<h3>选中 Patch</h3><p>点击地图上的 Patch 矩形</p>';
    })
    .catch(err => {
      alert('加载失败: ' + err);
      document.getElementById('loading').style.display = 'none';
    });
}

function updateSidebar(data) {
  document.getElementById('s-total').textContent = data.total_patches.toLocaleString();
  document.getElementById('s-crs').textContent = data.crs;
  document.getElementById('hs-total').textContent = data.total_patches.toLocaleString();
  document.getElementById('hs-region').textContent = data.display_name;

  const [bw, bs, be, bn] = data.overall_bbox_wgs84;
  document.getElementById('s-bbox').innerHTML =
    `W: ${bw}°  E: ${be}°<br>S: ${bs}°  N: ${bn}°<br>` +
    `Δlon: ${(be - bw).toFixed(4)}°  Δlat: ${(bn - bs).toFixed(4)}°`;
}

function renderSarLegend(sarSites) {
  const el = document.getElementById('sar-legend');
  el.innerHTML = Object.entries(sarSites).map(([name, site]) =>
    `<div class="sar-item">
       <div class="sar-dot" style="background:${site.color}"></div>
       <span>${name}</span>
     </div>`
  ).join('');
}

// ─── 可见 patch 统计 ─────────────────────────────────────────────────────────
function updateVisibleCount() {
  if (!patchLayers || !currentRegion) {
    document.getElementById('sb-visible').textContent = '—';
    return;
  }
  const mapBounds = map.getBounds();
  let count = 0;
  currentRegion.patches.forEach(p => {
    const [pw, ps, pe, pn] = p.bounds_wgs84;
    if (mapBounds.intersects([[ps, pw], [pn, pe]])) count++;
  });
  document.getElementById('sb-visible').textContent = count.toLocaleString();
}

function updateStatusBar() {
  const c = map.getCenter();
  document.getElementById('sb-center').textContent =
    `${c.lat.toFixed(4)}°, ${c.lng.toFixed(4)}°`;
  document.getElementById('sb-zoom').textContent = map.getZoom();
}

// ─── 初始化 ──────────────────────────────────────────────────────────────────
fetch(DATA_DIR + 'index.json')
  .then(r => r.json())
  .then(index => {
    allRegions = index;
    const tabs = document.getElementById('region-tabs');
    index.forEach((reg, i) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
      btn.dataset.region = reg.region;
      btn.textContent = `${reg.display} (${reg.patches.toLocaleString()})`;
      btn.addEventListener('click', () => switchRegion(reg.region));
      tabs.appendChild(btn);
    });
    if (index.length > 0) switchRegion(index[0].region);
  })
  .catch(err => {
    document.getElementById('loading').style.display = 'none';
    alert('无法加载 index.json，请先运行 gen_viz_patches.py\n' + err);
  });

map.on('click', () => {
  if (selectedLayer) {
    const col = currentRegion ? regionColor(currentRegion.region_name) : {};
    selectedLayer.setStyle({ fillOpacity: 0.15, weight: 1, color: col.stroke || '#999' });
    selectedLayer = null;
    const el = document.getElementById('patch-detail');
    el.classList.add('empty');
    el.innerHTML = '<h3>选中 Patch</h3><p>点击地图上的 Patch 矩形</p>';
  }
});
</script>
</body>
</html>
