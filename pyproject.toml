[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xuannv"
version = "0.1.0"
description = "AlphaEarth Foundations 改进版"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy",
    "rasterio",
    "geopandas",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
